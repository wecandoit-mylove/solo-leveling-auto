<!DOCTYPE html>
<html>
<head>
    <title>简单测试</title>
    <script>
    async function test() {
        const params = new URLSearchParams(window.location.search);
        const cookie = params.get('cookie');
        const webhook = params.get('webhook');
        
        console.log('Cookie:', cookie ? '有' : '无');
        console.log('Webhook:', webhook);
        
        if (!cookie) {
            document.body.innerHTML = '<h1>❌ 无Cookie</h1>';
            return;
        }
        
        // 调用API
        try {
            const response = await fetch('https://slvshop.netmarble.com/api/shop/daily-reward?localeCode=EN_US', {
                headers: {
                    'Cookie': cookie,
                    'Accept': 'application/json'
                }
            });
            
            const result = await response.json();
            console.log('API结果:', result);
            
            document.body.innerHTML = `<h1>${result.errorCode === 0 ? '✅ 成功' : '📅 已领取'}</h1><p>${result.errorMessage}</p>`;
            
            // 上报结果
            if (webhook) {
                await fetch(webhook, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(result)
                });
                console.log('结果已上报');
            }
            
        } catch (error) {
            document.body.innerHTML = `<h1>❌ 错误</h1><p>${error.message}</p>`;
            console.error('错误:', error);
        }
    }
    
    window.onload = test;
    </script>
</head>
<body>
    <h1>测试中...</h1>
</body>
</html>
