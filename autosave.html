<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>自动签到</title>
    <style>
        body { font-family: Arial; max-width: 600px; margin: 20px auto; padding: 20px; }
        #result { padding: 15px; margin: 20px 0; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
    </style>
</head>
<body>
    <h1>🎮 自动签到执行中...</h1>
    <div id="result">正在执行...</div>
    
    <script>
    async function executeSignIn() {
        const params = new URLSearchParams(window.location.search);
        const cookie = params.get('cookie');
        const webhook = params.get('webhook');
        
        console.log('参数:', { hasCookie: !!cookie, hasWebhook: !!webhook });
        
        if (!cookie) {
            showResult('error', '❌ 错误', '缺少Cookie参数');
            return;
        }
        
        try {
            // 调用签到API
            const response = await fetch('https://slvshop.netmarble.com/api/shop/daily-reward?localeCode=EN_US', {
                headers: {
                    'Cookie': decodeURIComponent(cookie),
                    'Accept': 'application/json'
                }
            });
            
            const result = await response.json();
            console.log('API结果:', result);
            
            // 显示结果
            if (result.errorCode === 0) {
                showResult('success', '✅ 签到成功', 
                    `奖励: ${result.resultData?.itemName || '未知奖励'}`);
            } else if (result.errorCode === 730000) {
                showResult('info', '📅 今日已领取', result.errorMessage);
            } else {
                showResult('error', '❌ 签到失败', 
                    `${result.errorMessage || '错误码: ' + result.errorCode}`);
            }
            
            // 上报结果
            if (webhook) {
                try {
                    await fetch(decodeURIComponent(webhook), {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(result)
                    });
                    console.log('结果已上报');
                } catch (webhookError) {
                    console.error('上报失败:', webhookError);
                }
            }
            
        } catch (error) {
            console.error('请求失败:', error);
            showResult('error', '❌ 请求失败', error.message);
        }
    }
    
    function showResult(type, title, message) {
        const element = document.getElementById('result');
        element.className = type;
        element.innerHTML = `<h3>${title}</h3><p>${message}</p>`;
    }
    
    // 页面加载时自动执行
    window.onload = executeSignIn;
    </script>
</body>
</html>
